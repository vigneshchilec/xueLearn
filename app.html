<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOP AI — Learn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#FF4D6D;--orange:#FF9F1C;--teal:#2EC4B6;--purple:#7B2FBE;
  --pink-l:#FFF0F3;--orange-l:#FFF8EC;--teal-l:#E8FAFA;--purple-l:#F5EEFF;
  --text:#1A1A2E;--muted:#6B7280;--white:#FFFFFF;--bg:#FAFAFA;
  --card:#FFFFFF;--border:#E5E7EB;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Nav */
.nav{background:var(--white);border-bottom:2px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.nav-left{display:flex;align-items:center;gap:14px}
.nav-back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px}
.nav-back:hover{color:var(--pink)}
.nav-logo{font-size:17px;font-weight:800;letter-spacing:-0.5px;color:var(--text)}.nav-logo span{color:var(--pink)}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-user{font-size:13px;color:var(--muted)}
.nav-signout{font-size:13px;color:var(--muted);cursor:pointer;border:1.5px solid var(--border);border-radius:99px;padding:5px 12px;background:transparent;font-family:inherit;transition:all .15s}
.nav-signout:hover{color:var(--text);border-color:var(--pink)}

/* Main */
.main{max-width:560px;margin:0 auto;padding:24px 16px}

/* Child selector */
.section-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.children-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.child-pill{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;border:2px solid var(--border);background:var(--white);cursor:pointer;transition:all .15s;font-size:14px;font-weight:600;color:var(--muted)}
.child-pill.active{background:var(--pink-l);border-color:var(--pink);color:var(--pink)}
.child-pill:hover{border-color:var(--pink);color:var(--pink)}
.child-avatar{width:24px;height:24px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.add-child{padding:8px 16px;border-radius:99px;border:2px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
.add-child:hover{border-color:var(--teal);color:var(--teal)}

/* Add child modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--white);border:2px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:380px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text)}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.modal-field input,.modal-field select{width:100%;padding:11px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:inherit}
.modal-field input:focus,.modal-field select:focus{border-color:var(--teal)}
.modal-field select option{background:var(--white)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-cancel{flex:1;padding:11px;border-radius:10px;background:transparent;border:1.5px solid var(--border);color:var(--muted);cursor:pointer;font-size:14px;font-family:inherit}
.modal-save{flex:2;padding:11px;border-radius:10px;background:var(--teal);border:none;color:#fff;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit}

/* Game card */
.game-card{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.mode-tabs{display:flex;gap:6px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:16px;border:1.5px solid var(--border)}
.mode-tab{flex:1;padding:7px 4px;border-radius:7px;border:none;background:transparent;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;text-align:center;font-family:inherit}
.mode-tab.active{background:var(--orange);color:#fff}

/* Quiz styles */
.g-companion{display:flex;gap:10px;align-items:flex-start;background:var(--orange-l);border-radius:12px;padding:10px 12px;margin-bottom:14px;border:1.5px solid #FFE4B0}
.g-bao{width:36px;height:36px;border-radius:99px;background:var(--orange-l);border:2px solid #FFE4B0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.g-bao-name{font-size:10px;color:var(--orange);margin-bottom:2px;font-weight:700;letter-spacing:.05em}
.g-bao-msg{font-size:12px;color:var(--text);line-height:1.5}
.g-pic{background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.g-pinyin{text-align:center;font-size:14px;color:var(--teal);font-weight:700;margin-bottom:12px;letter-spacing:.05em}
.g-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-choice{padding:13px 8px;border-radius:12px;border:2px solid var(--border);background:var(--white);font-size:14px;font-weight:700;color:var(--text);transition:all .15s;text-align:center;cursor:pointer;font-family:inherit}
.g-choice:hover:not(:disabled){border-color:var(--purple);background:var(--purple-l);color:var(--purple)}
.g-choice.correct{border-color:#10B981;background:#ECFDF5;color:#065F46}
.g-choice.wrong{border-color:var(--pink);background:var(--pink-l);color:var(--pink)}
.g-choice:disabled{cursor:default}
.g-feedback{text-align:center;font-size:13px;font-weight:700;min-height:20px;margin-top:10px;color:var(--text)}
.g-next{width:100%;padding:12px;border-radius:12px;background:var(--orange);color:#fff;font-size:14px;font-weight:700;border:none;margin-top:10px;cursor:pointer;font-family:inherit;transition:opacity .15s}.g-next:hover{opacity:.9}
.g-dots{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
.g-dot{width:9px;height:9px;border-radius:99px;background:var(--border)}
.g-dot.ok{background:#10B981}.g-dot.no{background:var(--pink)}.g-dot.cur{background:var(--orange)}
.hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hud-stars{font-size:13px;background:var(--orange-l);color:var(--orange);border-radius:99px;padding:4px 14px;font-weight:700;border:1.5px solid #FFE4B0}
.hud-streak{font-size:13px;background:var(--pink-l);color:var(--pink);border-radius:99px;padding:4px 14px;font-weight:700;border:1.5px solid #FFB3C1}

/* Summary */
.summary-card{background:#1A2F45;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;text-align:center;margin-bottom:16px}
.sum-emoji{font-size:44px;margin-bottom:10px}
.sum-title{font-size:18px;font-weight:700;margin-bottom:4px}
.sum-sub{font-size:13px;color:#8BA8C4;margin-bottom:16px}
.sum-stats{display:flex;justify-content:center;gap:24px;margin-bottom:20px}
.sum-num{font-size:24px;font-weight:700;color:#FF7F3E}
.sum-label{font-size:11px;color:#8BA8C4;font-weight:600;margin-top:2px}
.sum-again{padding:10px 24px;border-radius:10px;background:#FF7F3E;color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:inherit}

/* Dashboard preview */
.dash-card{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.dash-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text)}
.dash-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dash-skill{font-size:12px;color:var(--muted);min-width:80px;font-weight:600}
.dash-bar-wrap{flex:1;height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.dash-bar{height:100%;border-radius:99px;background:var(--teal);transition:width .6s ease}
.dash-pct{font-size:12px;color:var(--muted);min-width:32px;text-align:right;font-weight:600}
.no-child{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.7}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-left">
    <a class="nav-back" href="hub.html">&larr; Back to Hub</a>
    <div class="nav-logo">ATOP<span>AI</span></div>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <button class="nav-signout" onclick="signOut()">Sign out</button>
  </div>
</nav>

<div class="main">

  <!-- Child selector -->
  <div class="section-label">Learning for</div>
  <div class="children-row" id="children-row">
    <button class="add-child" onclick="showAddChild()">+ Add child 添加孩子</button>
  </div>

  <!-- No child state -->
  <div id="no-child-msg" class="game-card" style="display:none">
    <div class="no-child">
      <div style="font-size:36px;margin-bottom:12px">👶</div>
      <div style="font-size:16px;font-weight:600;color:#fff;margin-bottom:8px">Add your child to start learning</div>
      添加孩子开始学习<br><br>
      <button class="g-next" style="width:auto;padding:10px 24px" onclick="showAddChild()">+ Add child</button>
    </div>
  </div>

  <!-- Game -->
  <div id="game-section" style="display:none">
    <div class="game-card">
      <div class="hud">
        <div class="hud-stars">★ <span id="stars">0</span></div>
        <div class="hud-streak" id="streak-badge" style="display:none">🔥 <span id="streak">0</span></div>
      </div>
      <div class="mode-tabs">
        <button class="mode-tab active" onclick="switchMode('quiz',this)">Pictogram 图画</button>
        <button class="mode-tab" onclick="switchMode('fill',this)">Fill in 填空</button>
      </div>
      <div id="game-area"></div>
    </div>

    <!-- Dashboard -->
    <div class="dash-card" id="dash-card" style="display:none">
      <div class="dash-title">📊 <span id="child-name-dash"></span>'s progress this session</div>
      <div class="dash-row"><div class="dash-skill">Characters</div><div class="dash-bar-wrap"><div class="dash-bar" id="bar-char" style="width:0%"></div></div><div class="dash-pct" id="pct-char">—</div></div>
      <div class="dash-row"><div class="dash-skill">Fill-in</div><div class="dash-bar-wrap"><div class="dash-bar" id="bar-fill" style="width:0%"></div></div><div class="dash-pct" id="pct-fill">—</div></div>
      <div class="dash-row"><div class="dash-skill">Overall</div><div class="dash-bar-wrap"><div class="dash-bar" id="bar-overall" style="width:0%"></div></div><div class="dash-pct" id="pct-overall">—</div></div>
    </div>
  </div>
</div>

<!-- Add child modal -->
<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)hideModal()">
  <div class="modal">
    <div class="modal-title">Add a child 添加孩子</div>
    <div class="modal-sub">You can add multiple children and switch between them.</div>
    <div class="modal-field"><label>Child's name</label><input id="child-name-input" type="text" placeholder="e.g. Xiao Ming"/></div>
    <div class="modal-field">
      <label>Age</label>
      <select id="child-age">
        <option value="4">4 years old</option>
        <option value="5">5 years old</option>
        <option value="6" selected>6 years old</option>
        <option value="7">7 years old</option>
        <option value="8">8 years old</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="hideModal()">Cancel</button>
      <button class="modal-save" onclick="saveChild()">Save →</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://efsyzwpbysdzqptqshco.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmc3l6d3BieXNkenFwdHFzaGNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMDU3NDIsImV4cCI6MjA5ODY4MTc0Mn0.V_fqeXyK7Q9mIfhujXy6TX1yT-t-l5Dce58YbznEPZI';
// ─────────────────────────────────────────────────────────────────────────────

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let children    = [];
let activeChild = null;
let sessionData = { quiz: { correct:0, total:0 }, fill: { correct:0, total:0 } };

// Auth guard
sb.auth.getSession().then(({ data }) => {
  if (!data.session) { window.location.href = 'login.html'; return; }
  currentUser = data.session.user;
  const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
  document.getElementById('nav-user').textContent = 'Hi, ' + name + ' 👋';
  loadChildren();
});

async function signOut() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

// ── Children ─────────────────────────────────────────────────────────────────
function loadChildren() {
  const stored = localStorage.getItem('atop_children_' + currentUser.id);
  children = stored ? JSON.parse(stored) : [];
  renderChildren();
}

function renderChildren() {
  const row = document.getElementById('children-row');
  row.innerHTML = '';
  children.forEach((c, i) => {
    const pill = document.createElement('button');
    pill.className = 'child-pill' + (activeChild?.id === c.id ? ' active' : '');
    pill.innerHTML = '<div class="child-avatar">' + c.name.charAt(0).toUpperCase() + '</div>' + c.name;
    pill.onclick = () => selectChild(c);
    row.appendChild(pill);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'add-child';
  addBtn.textContent = '+ Add child';
  addBtn.onclick = showAddChild;
  row.appendChild(addBtn);

  if (children.length === 0) {
    document.getElementById('no-child-msg').style.display = '';
    document.getElementById('game-section').style.display = 'none';
  } else if (!activeChild) {
    selectChild(children[0]);
  }
}

function selectChild(child) {
  activeChild = child;
  document.getElementById('no-child-msg').style.display = 'none';
  document.getElementById('game-section').style.display = '';
  document.getElementById('child-name-dash').textContent = child.name;
  sessionData = { quiz:{correct:0,total:0}, fill:{correct:0,total:0} };
  renderChildren();
  startGame();
}

function showAddChild() { document.getElementById('modal').style.display = 'flex'; }
function hideModal()     { document.getElementById('modal').style.display = 'none'; }

function saveChild() {
  const name = document.getElementById('child-name-input').value.trim();
  const age  = document.getElementById('child-age').value;
  if (!name) return;
  const child = { id: Date.now().toString(), name, age: parseInt(age) };
  children.push(child);
  localStorage.setItem('atop_children_' + currentUser.id, JSON.stringify(children));
  hideModal();
  document.getElementById('child-name-input').value = '';
  selectChild(child);
}

    svg:'<svg viewBox="0 0 130 130" width="120" height="120" xmlns="http://www.w3.org/2000/svg"><rect width="130" height="130" fill="#120800" rx="10"/><ellipse cx="65" cy="120" rx="38" ry="11" fill="#FF4500" opacity="0.35"/><path d="M65,120 Q47,107 49,87 Q36,99 34,81 Q34,63 47,48 Q43,61 51,61 Q47,45 58,32 Q57,47 65,45 Q73,47 72,32 Q83,45 79,61 Q87,61 83,48 Q96,63 96,81 Q94,99 81,87 Q83,107 65,120Z" fill="#FF6600"/><path d="M65,112 Q51,101 53,87 Q46,95 47,84 Q52,73 57,79 Q55,65 65,50 Q75,65 73,79 Q78,73 83,84 Q84,95 77,87 Q79,101 65,112Z" fill="#FF9F1C"/><path d="M65,104 Q55,95 57,84 Q52,90 53,83 Q58,75 61,81 Q60,70 65,58 Q70,70 69,81 Q72,75 77,83 Q78,90 73,84 Q75,95 65,104Z" fill="#FFE066"/><text x="65" y="92" text-anchor="middle" font-family="serif" font-size="30" font-weight="900" fill="#1a0400" opacity="0.8">火</text></svg>' },
  { char:'木', pinyin:'mù',   answer:'Tree',     choices:['Tree','Leaf','Forest','Branch'],
    svg:'<svg viewBox="0 0 130 130" width="120" height="120" xmlns="http://www.w3.org/2000/svg"><rect width="130" height="130" fill="#1a2e1a" rx="10"/><rect x="0" y="102" width="130" height="28" fill="#132010"/><line x1="65" y1="102" x2="47" y2="122" stroke="#8B5E3C" stroke-width="4" stroke-linecap="round"/><line x1="65" y1="102" x2="83" y2="122" stroke="#8B5E3C" stroke-width="4" stroke-linecap="round"/><rect x="59" y="64" width="12" height="40" rx="4" fill="#8B5E3C"/><line x1="65" y1="78" x2="40" y2="64" stroke="#7a5232" stroke-width="6" stroke-linecap="round"/><line x1="65" y1="78" x2="90" y2="64" stroke="#7a5232" stroke-width="6" stroke-linecap="round"/><circle cx="40" cy="52" r="16" fill="#2d6e3a"/><circle cx="90" cy="52" r="15" fill="#2d6e3a"/><circle cx="65" cy="38" r="22" fill="#3a8a48"/><circle cx="54" cy="44" r="13" fill="#348040"/><circle cx="76" cy="44" r="12" fill="#348040"/><text x="65" y="96" text-anchor="middle" font-family="serif" font-size="26" font-weight="900" fill="white" opacity="0.8">木</text></svg>' },
];

const FILL_Q = [
  {template:'The ___ shines every day.',zh:'___ 每天都照耀。',answer:'Sun',charHint:'日 = Sun',tiles:['Sun','Moon','Rain','Wind']},
  {template:'We drink clean ___.',zh:'我们喝干净的___。',answer:'Water',charHint:'水 = Water',tiles:['Water','Fire','Earth','Snow']},
  {template:'The ___ is very tall.',zh:'___ 很高。',answer:'Mountain',charHint:'山 = Mountain',tiles:['Mountain','Tree','Wind','Moon']},
  {template:'A ___ keeps us warm.',zh:'___ 让我们暖和。',answer:'Fire',charHint:'火 = Fire',tiles:['Snow','Rain','Fire','Water']},
];

const BAO_INTRO=['这个图是什么意思？','你能猜到吗？','仔细看一看！'];
const BAO_RIGHT=['答对了！太棒了！','非常聪明！','你真厉害！'];
const BAO_WRONG=['好尝试！再想想。','差一点！加油！'];

function rand(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}

let mode='quiz', qIdx=0, qResults=[], qAnswered=false;
let fIdx=0, fResults=[], fAnswered=false;
let stars=0, streak=0;

function switchMode(m, btn) {
  mode=m; qIdx=0; qResults=[]; qAnswered=false; fIdx=0; fResults=[]; fAnswered=false;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  startGame();
}

function startGame() {
  stars=0; streak=0;
  document.getElementById('stars').textContent=0;
  document.getElementById('streak-badge').style.display='none';
  qIdx=0; qResults=[]; qAnswered=false;
  fIdx=0; fResults=[]; fAnswered=false;
  renderGame();
}

function renderGame() {
  if(mode==='quiz') renderQuiz();
  else renderFill();
}

function dotsHtml(total,results,cur){
  return Array.from({length:total},(_,i)=>{
    let c='g-dot';
    if(i<results.length) c+=results[i]?' ok':' no';
    else if(i===cur) c+=' cur';
    return '<div class="'+c+'"></div>';
  }).join('');
}

function renderQuiz() {
  if(qIdx>=CHARS.length){renderDone('quiz',qResults);return;}
  qAnswered=false;
  const q=CHARS[qIdx];
  const opts=shuffle(q.choices);
  const area=document.getElementById('game-area');
  area.innerHTML=
    '<div class="g-dots">'+dotsHtml(CHARS.length,qResults,qIdx)+'</div>'+
    '<div class="g-companion"><div class="g-bao" id="bao">🐼</div><div><div class="g-bao-name">BAO BAO</div><div class="g-bao-msg" id="bmsg">'+rand(BAO_INTRO)+'</div></div></div>'+
    '<div class="g-pic">'+q.svg+'</div>'+
    '<div class="g-pinyin">'+q.pinyin+'</div>'+
    '<div class="g-choices" id="choices"></div>'+
    '<div class="g-feedback" id="fb"></div>';
  var cw=document.getElementById('choices');
  opts.forEach(function(c){
    var btn=document.createElement('button');
    btn.className='g-choice'; btn.textContent=c;
    (function(b,val){b.onclick=function(){pickQuiz(b,val,q.answer);};})(btn,c);
    cw.appendChild(btn);
  });
}

function pickQuiz(btn,val,answer){
  if(qAnswered)return; qAnswered=true;
  document.querySelectorAll('.g-choice').forEach(function(b){b.disabled=true;if(b.textContent===answer)b.classList.add('correct');});
  var ok=val===answer; qResults.push(ok);
  if(ok){
    btn.classList.add('correct');
    document.getElementById('bao').textContent='😄';
    document.getElementById('bmsg').textContent=rand(BAO_RIGHT);
    document.getElementById('fb').innerHTML='✓ <span style="color:#3DB87A">'+answer+'</span> = <span style="font-family:serif;font-size:16px">'+CHARS[qIdx].char+'</span>';
    stars+=10; streak++;
    document.getElementById('stars').textContent=stars;
    if(streak>=2){document.getElementById('streak-badge').style.display='';document.getElementById('streak').textContent=streak;}
    sessionData.quiz.correct++; sessionData.quiz.total++;
  } else {
    btn.classList.add('wrong');
    document.getElementById('bao').textContent='😅';
    document.getElementById('bmsg').textContent=rand(BAO_WRONG);
    document.getElementById('fb').innerHTML='答案是 <span style="color:#3DB87A;font-family:serif;font-size:16px">'+answer+'</span>';
    streak=0; document.getElementById('streak-badge').style.display='none';
    sessionData.quiz.total++;
  }
  var nb=document.createElement('button'); nb.className='g-next';
  nb.textContent=qIdx+1>=CHARS.length?'看结果 →':'下一题 →';
  nb.onclick=function(){qIdx++;renderQuiz();};
  document.getElementById('game-area').appendChild(nb);
}

function renderFill(){
  if(fIdx>=FILL_Q.length){renderDone('fill',fResults);return;}
  fAnswered=false;
  const q=FILL_Q[fIdx];
  const tiles=shuffle([q.answer,...q.tiles.filter(t=>t!==q.answer)]).slice(0,4);
  const area=document.getElementById('game-area');
  area.innerHTML=
    '<div class="g-dots">'+dotsHtml(FILL_Q.length,fResults,fIdx)+'</div>'+
    '<div class="g-companion"><div class="g-bao">🐼</div><div><div class="g-bao-name">BAO BAO</div><div class="g-bao-msg">填入缺少的单词！Fill in the blank!</div></div></div>'+
    '<div style="background:rgba(96,168,224,.1);color:#60A8E0;border-radius:8px;padding:4px 12px;font-size:12px;font-weight:700;text-align:center;margin-bottom:12px">'+q.charHint+'</div>'+
    '<div style="font-size:18px;font-weight:700;text-align:center;margin-bottom:4px" id="fsent">'+q.template.replace('___','<span style="color:rgba(255,255,255,.3)">___</span>')+'</div>'+
    '<div style="font-size:12px;text-align:center;color:rgba(255,255,255,.35);margin-bottom:14px">'+q.zh+'</div>'+
    '<div id="fblank" style="min-width:100px;min-height:38px;border-radius:9px;border:2px dashed rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:rgba(255,255,255,.3);margin:0 auto 14px;padding:6px 18px;transition:all .2s">___</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:7px;justify-content:center" id="fbank"></div>'+
    '<div class="g-feedback" id="fb"></div>';
  var bank=document.getElementById('fbank');
  tiles.forEach(function(t){
    var btn=document.createElement('button');
    btn.style.cssText='padding:7px 14px;border-radius:99px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit';
    btn.textContent=t;
    (function(b,word){b.onclick=function(){pickFill(b,word,q.answer,q.template);};})(btn,t);
    bank.appendChild(btn);
  });
}

function pickFill(btn,word,answer,template){
  if(fAnswered)return; fAnswered=true;
  document.querySelectorAll('#fbank button').forEach(function(b){b.disabled=true;b.style.opacity='.3';});
  var ok=word===answer; fResults.push(ok);
  var bl=document.getElementById('fblank');
  bl.textContent=word; bl.style.borderStyle='solid'; bl.style.fontWeight='700';
  if(ok){
    bl.style.borderColor='#3DB87A'; bl.style.color='#3DB87A';
    document.getElementById('fb').textContent='Correct! 答对了！'; document.getElementById('fb').style.color='#3DB87A';
    stars+=12; streak++;
    document.getElementById('stars').textContent=stars;
    if(streak>=2){document.getElementById('streak-badge').style.display='';document.getElementById('streak').textContent=streak;}
    sessionData.fill.correct++; sessionData.fill.total++;
  } else {
    bl.style.borderColor='#e84040'; bl.style.color='#e84040';
    document.getElementById('fb').innerHTML='答案是 <span style="color:#3DB87A">'+answer+'</span>';
    document.getElementById('fb').style.color='#e84040';
    streak=0; document.getElementById('streak-badge').style.display='none';
    sessionData.fill.total++;
  }
  document.getElementById('fsent').innerHTML=template.replace('___','<span style="color:'+(ok?'#3DB87A':'#e84040')+';font-weight:800">'+word+'</span>');
  var nb=document.createElement('button'); nb.className='g-next';
  nb.textContent=fIdx+1>=FILL_Q.length?'看结果 →':'下一题 →';
  nb.onclick=function(){fIdx++;renderFill();};
  document.getElementById('game-area').appendChild(nb);
}

function renderDone(modeKey, results) {
  var ok=results.filter(Boolean).length;
  var pct=Math.round(ok/results.length*100);
  document.getElementById('game-area').innerHTML=
    '<div style="text-align:center;padding:16px 0">'+
    '<div style="font-size:40px;margin-bottom:10px">'+(pct===100?'🌟':pct>=75?'⭐':'💪')+'</div>'+
    '<div style="font-size:17px;font-weight:700;margin-bottom:4px">'+(pct>=75?'太棒了！':'继续加油！')+'</div>'+
    '<div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:16px">'+ok+'/'+results.length+' · '+pct+'%</div>'+
    '<button class="g-next" style="width:auto;padding:10px 24px" onclick="startGame()">再玩一次</button>'+
    '</div>';
  updateDashboard();
  logSession(modeKey, results);
}

function updateDashboard(){
  var qPct = sessionData.quiz.total>0 ? Math.round(sessionData.quiz.correct/sessionData.quiz.total*100) : null;
  var fPct = sessionData.fill.total>0 ? Math.round(sessionData.fill.correct/sessionData.fill.total*100) : null;
  var totC = sessionData.quiz.correct+sessionData.fill.correct;
  var totT = sessionData.quiz.total+sessionData.fill.total;
  var oPct = totT>0 ? Math.round(totC/totT*100) : null;
  document.getElementById('dash-card').style.display='';
  function setBar(barId,pctId,val){
    if(val===null){document.getElementById(pctId).textContent='—';return;}
    document.getElementById(barId).style.width=val+'%';
    document.getElementById(pctId).textContent=val+'%';
  }
  setBar('bar-char','pct-char',qPct);
  setBar('bar-fill','pct-fill',fPct);
  setBar('bar-overall','pct-overall',oPct);
}

async function logSession(modeKey, results){
  if(!currentUser||!activeChild) return;
  var answers=results.map(function(r,i){return{char:modeKey==='quiz'?CHARS[i]?.char:'fill_'+i,correct:r,ts:Date.now()};});
  try {
    await fetch('https://atop-backend.onrender.com/api/session',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        childId: activeChild.id+'_'+currentUser.id,
        mode: modeKey,
        unit: 'nature',
        answers: answers,
        starsEarned: stars
      })
    });
  } catch(e){ console.log('session log error',e); }
}
</script>
