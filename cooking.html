<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妈妈做晚饭 · Mom Cooks Dinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Sans+SC:wght@700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FDF3E7;
    --paper-deep: #F7E6CF;
    --ink: #3B2A1A;
    --ink-soft: #6B5540;
    --forest: #4C7A3D;
    --forest-light: #7FAE68;
    --lantern: #D64545;
    --lantern-deep: #A5312F;
    --gold: #E8A83E;
    --card-radius: 22px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(76,122,61,0.15), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(214,69,69,0.15), transparent 50%),
      var(--paper);
    font-family:'Baloo 2', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 32px 16px 64px;
  }
  .app{ width:100%; max-width: 640px; }

  header{ text-align:center; margin-bottom: 22px; }
  .back-link{
    display:inline-block; margin-bottom:10px; font-size:13px; font-weight:600;
    color: var(--ink-soft); text-decoration:none;
  }
  .back-link:hover{ color: var(--lantern-deep); }
  .eyebrow{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--forest); font-weight:600; margin:0 0 6px;
  }
  h1{
    font-family:'ZCOOL KuaiLe', 'Baloo 2', sans-serif;
    font-size: clamp(26px, 6vw, 34px);
    margin: 0 0 4px;
    color: var(--lantern-deep);
  }
  .subtitle{ margin:0; font-size:14px; color: var(--ink-soft); }

  .stage{
    background: var(--paper-deep);
    border: 3px solid var(--ink);
    border-radius: var(--card-radius);
    padding: 14px;
    box-shadow: 0 8px 0 rgba(59,42,26,0.12);
  }
  .illustration{
    width:100%;
    display:block;
    border-radius: 14px;
    overflow:hidden;
    background:#fff;
  }
  .illustration svg{ width:100%; height:auto; display:block; }

  .caption{
    margin: 16px 4px 4px;
    font-size: 16px;
    line-height:1.55;
    color: var(--ink);
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin: 10px 4px 0;
    padding: 5px 12px;
    background: rgba(214,69,69,0.12);
    color: var(--lantern-deep);
    border-radius: 999px;
    font-size: 13px;
    font-weight:600;
  }

  .prompt{
    margin: 20px 4px 10px;
    font-size: 14px;
    color: var(--forest);
    font-weight:600;
  }

  .choices{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top: 6px;
  }
  .tile{
    position:relative;
    width: 150px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 14px 10px 12px;
    text-align:center;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
    box-shadow: 0 5px 0 rgba(59,42,26,0.18);
  }
  .tile:hover{
    background: var(--gold);
    transform: translateY(-3px);
  }
  .tile:active{
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(59,42,26,0.18);
  }
  .tile .hanzi{
    font-family:'Noto Sans SC', sans-serif;
    font-weight:900;
    font-size: 44px;
    line-height:1;
    display:block;
    color: var(--ink);
  }
  .tile .pinyin{
    display:block;
    margin-top:8px;
    font-size:13px;
    color: var(--ink-soft);
    font-weight:600;
  }
  .tile .speak{
    position:absolute;
    top:6px;
    right:6px;
    width:26px;
    height:26px;
    border-radius:50%;
    border: none;
    background: rgba(76,122,61,0.12);
    color: var(--forest);
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tile .speak:hover{ background: var(--forest); color:#fff; }

  .restart-row{ text-align:center; margin-top: 18px; }
  .restart{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    background: var(--lantern);
    color:#fff;
    border:3px solid var(--ink);
    border-radius: 999px;
    padding: 10px 26px;
    cursor:pointer;
    box-shadow: 0 5px 0 rgba(59,42,26,0.25);
  }
  .restart:hover{ background: var(--lantern-deep); }
  .restart:active{ transform: translateY(2px); box-shadow: 0 2px 0 rgba(59,42,26,0.25); }

  .trail{
    display:flex; gap:6px; justify-content:center; margin-top:22px;
  }
  .trail span{
    width:8px; height:8px; border-radius:50%;
    background: rgba(59,42,26,0.18);
  }
  .trail span.done{ background: var(--forest); }

  @media (max-width:420px){
    .tile{ width: 30%; padding:10px 6px 10px; }
    .tile .hanzi{ font-size: 32px; }
    .tile .pinyin{ font-size:11px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back-link" href="index.html">&larr; Back to menu</a>
    <p class="eyebrow">Learn Chinese through story</p>
    <h1>妈妈做晚饭</h1>
    <p class="subtitle">Mom Cooks Dinner — tap the character that shows what she should do next</p>
  </header>

  <div class="stage">
    <div class="illustration" id="illustration"></div>
    <p class="caption" id="caption"></p>
    <p class="tag" id="tag" style="display:none;"></p>
    <p class="prompt" id="prompt">What should Mom do?</p>
    <div class="choices" id="choices"></div>
    <div class="restart-row" id="restartRow" style="display:none;">
      <button class="restart" id="restartBtn">重新开始 · Play again</button>
    </div>
  </div>

  <div class="trail" id="trail"></div>
</div>

<script>
function person(x, y, s, body, head, extra){
  return `<g transform="translate(${x},${y}) scale(${s})">
  <ellipse cx="10" cy="46" rx="16" ry="7" fill="rgba(0,0,0,0.12)"/>
  <rect x="0" y="18" width="20" height="26" rx="8" fill="${body}"/>
  <circle cx="10" cy="8" r="12" fill="${head}"/>
  <rect x="-4" y="24" width="8" height="18" rx="4" fill="${head}"/>
  <rect x="16" y="24" width="8" height="18" rx="4" fill="${head}"/>
  ${extra||''}
  </g>`;
}
const hairBun = (c) => `<circle cx="10" cy="-3" r="5" fill="${c}"/>`;
const apronBib = `<rect x="3" y="27" width="14" height="17" rx="3" fill="#FFF8E7"/><line x1="10" y1="18" x2="10" y2="27" stroke="#FFF8E7" stroke-width="2"/>`;

function kitchenBase(propsBack, propsFront){
  return `<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" fill="#FFF5E6"/>
  <rect x="0" y="0" width="400" height="150" fill="#FDEBD3"/>
  <rect x="20" y="20" width="80" height="60" rx="6" fill="#E8A83E" stroke="#A9772E" stroke-width="3"/>
  <rect x="110" y="20" width="80" height="60" rx="6" fill="#E8A83E" stroke="#A9772E" stroke-width="3"/>
  <rect x="300" y="20" width="80" height="60" rx="6" fill="#E8A83E" stroke="#A9772E" stroke-width="3"/>
  ${propsBack||''}
  <rect x="0" y="150" width="400" height="20" fill="#C68642"/>
  <rect x="0" y="170" width="400" height="90" fill="#8B5A2B"/>
  ${propsFront||''}
  </svg>`;
}

const stoveProp = `<g transform="translate(230,100)">
  <rect x="0" y="0" width="70" height="34" rx="4" fill="#4A5568"/>
  <circle cx="16" cy="10" r="6" fill="#2D3748"/>
  <circle cx="46" cy="10" r="6" fill="#2D3748"/>
  <circle cx="16" cy="24" r="6" fill="#2D3748"/>
  <circle cx="46" cy="24" r="6" fill="#2D3748"/>
</g>`;

const svgStart = kitchenBase(``, `
  <g transform="translate(250,60)">
    <rect x="0" y="0" width="70" height="130" rx="8" fill="#E0F2FE" stroke="#4A5568" stroke-width="3"/>
    <line x1="0" y1="45" x2="70" y2="45" stroke="#4A5568" stroke-width="2"/>
    <rect x="60" y="10" width="6" height="20" rx="3" fill="#4A5568"/>
    <rect x="60" y="55" width="6" height="20" rx="3" fill="#4A5568"/>
  </g>
  ${person(120, 150, 1.5, '#D64545', '#F2C9A0', hairBun('#4A3222') + apronBib)}
`);

const svgBuy = kitchenBase(``, `
  <g transform="translate(190,158)">
    <rect x="0" y="28" width="90" height="30" rx="4" fill="#A9772E"/>
    <circle cx="14" cy="22" r="9" fill="#E53E3E"/>
    <circle cx="34" cy="18" r="9" fill="#68D391"/>
    <circle cx="54" cy="22" r="9" fill="#F6AD55"/>
    <path d="M74 32 L82 8 L90 32 Z" fill="#ED8936"/>
  </g>
  ${person(110, 150, 1.5, '#D64545', '#F2C9A0', hairBun('#4A3222') + apronBib)}
`);

const svgWash = kitchenBase(stoveProp, `
  <g transform="translate(220,150)">
    <rect x="0" y="20" width="80" height="30" rx="8" fill="#CBD5E0" stroke="#4A5568" stroke-width="2"/>
    <path d="M40 -4 Q40 -14 55 -14 L55 8" stroke="#4A5568" stroke-width="4" fill="none"/>
    <circle cx="55" cy="12" r="3" fill="#63B3ED"/>
    <circle cx="53" cy="20" r="2" fill="#63B3ED"/>
  </g>
  ${person(120, 150, 1.5, '#D64545', '#F2C9A0', hairBun('#4A3222') + apronBib)}
`);

const svgAsk = kitchenBase(``, `
  <g transform="translate(230,155)">
    <rect x="0" y="10" width="100" height="8" fill="#A9772E"/>
    <rect x="4" y="18" width="6" height="30" fill="#8B5A2B"/>
    <rect x="90" y="18" width="6" height="30" fill="#8B5A2B"/>
  </g>
  ${person(240, 130, 1.05, '#63B3ED', '#F2C9A0', '')}
  ${person(275, 132, 1.0, '#F6AD55', '#F2C9A0', '')}
  ${person(130, 150, 1.5, '#D64545', '#F2C9A0', hairBun('#4A3222') + apronBib)}
`);

const svgEnd = `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
<rect width="400" height="220" fill="#FDF3E7"/>
<circle cx="200" cy="110" r="72" fill="none" stroke="#A5312F" stroke-width="6"/>
<circle cx="200" cy="110" r="58" fill="none" stroke="#A5312F" stroke-width="2"/>
<text x="200" y="130" font-size="70" text-anchor="middle" fill="#A5312F" font-family="'Noto Sans SC', sans-serif" font-weight="900">完</text>
</svg>`;

const story = {
  start: {
    bg: svgStart,
    caption: "Mom opened the fridge — dinner time was coming soon, but she needed to get ready. What should she do first?",
    choices: [
      { char:'买', pinyin:'mǎi', meaning:'buy', next:'buy1' },
      { char:'洗', pinyin:'xǐ', meaning:'wash', next:'wash1' },
      { char:'问', pinyin:'wèn', meaning:'ask', next:'ask1' }
    ]
  },
  buy1: {
    bg: svgBuy,
    caption: "Mom went to the market, where colorful vegetables and fresh fish filled the stalls.",
    choices: [
      { char:'挑', pinyin:'tiāo', meaning:'pick', next:'end_buy_pick' },
      { char:'付', pinyin:'fù', meaning:'pay', next:'end_buy_pay' },
      { char:'问', pinyin:'wèn', meaning:'ask', next:'end_buy_ask' }
    ]
  },
  wash1: {
    bg: svgWash,
    caption: "Mom took out the vegetables already in the fridge and rinsed them clean under the tap.",
    choices: [
      { char:'切', pinyin:'qiè', meaning:'cut', next:'end_wash_cut' },
      { char:'炒', pinyin:'chǎo', meaning:'stir-fry', next:'end_wash_stirfry' },
      { char:'煮', pinyin:'zhǔ', meaning:'boil', next:'end_wash_boil' }
    ]
  },
  ask1: {
    bg: svgAsk,
    caption: "Mom asked the family what they wanted to eat tonight. Everyone shouted out their favorites!",
    choices: [
      { char:'炒', pinyin:'chǎo', meaning:'stir-fry', next:'end_ask_stirfry' },
      { char:'煮', pinyin:'zhǔ', meaning:'boil', next:'end_ask_boil' },
      { char:'烤', pinyin:'kǎo', meaning:'roast', next:'end_ask_roast' }
    ]
  },
  end_buy_pick: { ending:true, bg:svgEnd, caption:"Mom picked the freshest vegetables and juiciest tomatoes. Dinner turned out colorful and delicious!" },
  end_buy_pay: { ending:true, bg:svgEnd, caption:"Mom paid for everything and hurried home with full bags, ready to cook a wonderful meal." },
  end_buy_ask: { ending:true, bg:svgEnd, caption:"Mom asked the vendor for cooking tips and learned a new recipe the whole family loved." },
  end_wash_cut: { ending:true, bg:svgEnd, caption:"Mom cut the vegetables into neat little pieces, and dinner cooked up quickly and evenly." },
  end_wash_stirfry: { ending:true, bg:svgEnd, caption:"Mom stir-fried the vegetables in a sizzling hot pan, filling the kitchen with a wonderful aroma." },
  end_wash_boil: { ending:true, bg:svgEnd, caption:"Mom boiled the vegetables into a warm, comforting soup that the whole family slurped up happily." },
  end_ask_stirfry: { ending:true, bg:svgEnd, caption:"Mom stir-fried everyone's favorite dish, and the family cheered when it hit the table." },
  end_ask_boil: { ending:true, bg:svgEnd, caption:"Mom boiled a big pot of noodle soup, and everyone warmed up together on a chilly evening." },
  end_ask_roast: { ending:true, bg:svgEnd, caption:"Mom roasted chicken and vegetables in the oven, and the crispy, golden dinner disappeared in minutes!" }
};

let path = [];

function speak(char){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(char);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function render(id, chosen){
  const scene = story[id];
  document.getElementById('illustration').innerHTML = scene.bg;
  document.getElementById('caption').textContent = scene.caption;

  const tag = document.getElementById('tag');
  if(chosen){
    tag.style.display = 'inline-flex';
    tag.textContent = `You chose: ${chosen.char} ${chosen.pinyin} — ${chosen.meaning}`;
  } else {
    tag.style.display = 'none';
  }

  const choicesEl = document.getElementById('choices');
  const promptEl = document.getElementById('prompt');
  const restartRow = document.getElementById('restartRow');

  if(scene.ending){
    choicesEl.innerHTML = '';
    promptEl.style.display = 'none';
    restartRow.style.display = 'block';
  } else {
    promptEl.style.display = 'block';
    restartRow.style.display = 'none';
    choicesEl.innerHTML = '';
    scene.choices.forEach(choice => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `
        <button class="speak" aria-label="Hear pronunciation">&#128266;</button>
        <span class="hanzi">${choice.char}</span>
        <span class="pinyin">${choice.pinyin}</span>
      `;
      tile.querySelector('.speak').addEventListener('click', (e) => {
        e.stopPropagation();
        speak(choice.char);
      });
      tile.addEventListener('click', () => {
        path.push(id);
        speak(choice.char);
        render(choice.next, choice);
      });
      choicesEl.appendChild(tile);
    });
  }
  renderTrail();
}

function renderTrail(){
  const trail = document.getElementById('trail');
  const total = 3;
  const done = Math.min(path.length, total);
  trail.innerHTML = '';
  for(let i=0;i<total;i++){
    const dot = document.createElement('span');
    if(i < done) dot.className = 'done';
    trail.appendChild(dot);
  }
}

document.getElementById('restartBtn').addEventListener('click', () => {
  path = [];
  render('start', null);
});

render('start', null);
</script>
</body>
</html>
