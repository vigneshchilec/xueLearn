<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冒险乐园 · Adventure Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Sans+SC:wght@700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FFF6E9;
    --paper-deep: #FDEAC8;
    --ink: #3A2A1A;
    --ink-soft: #7A5C3E;
    --forest: #1E88A8;
    --forest-light: #63B8D9;
    --lantern: #E8543A;
    --lantern-deep: #B23A26;
    --gold: #FFC145;
    --card-radius: 22px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(30,136,168,0.15), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(232,84,58,0.15), transparent 50%),
      var(--paper);
    font-family:'Baloo 2', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 32px 16px 64px;
  }
  .app{ width:100%; max-width: 640px; }

  header{ text-align:center; margin-bottom: 22px; }
  .back-link{
    display:inline-block; margin-bottom:10px; font-size:13px; font-weight:600;
    color: var(--ink-soft); text-decoration:none;
  }
  .back-link:hover{ color: var(--lantern-deep); }
  .eyebrow{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--forest); font-weight:600; margin:0 0 6px;
  }
  h1{
    font-family:'ZCOOL KuaiLe', 'Baloo 2', sans-serif;
    font-size: clamp(26px, 6vw, 34px);
    margin: 0 0 4px;
    color: var(--lantern-deep);
  }
  .subtitle{ margin:0; font-size:14px; color: var(--ink-soft); }

  .stage{
    background: var(--paper-deep);
    border: 3px solid var(--ink);
    border-radius: var(--card-radius);
    padding: 14px;
    box-shadow: 0 8px 0 rgba(58,42,26,0.12);
  }
  .illustration{
    width:100%;
    display:block;
    border-radius: 14px;
    overflow:hidden;
    background:#fff;
  }
  .illustration svg{ width:100%; height:auto; display:block; }

  .caption{
    margin: 16px 4px 4px;
    font-size: 16px;
    line-height:1.55;
    color: var(--ink);
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin: 10px 4px 0;
    padding: 5px 12px;
    background: rgba(232,84,58,0.1);
    color: var(--lantern-deep);
    border-radius: 999px;
    font-size: 13px;
    font-weight:600;
  }

  .prompt{
    margin: 20px 4px 10px;
    font-size: 14px;
    color: var(--forest);
    font-weight:600;
  }

  .choices{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top: 6px;
  }
  .tile{
    position:relative;
    width: 150px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 14px 10px 12px;
    text-align:center;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
    box-shadow: 0 5px 0 rgba(58,42,26,0.18);
  }
  .tile:hover{
    background: var(--gold);
    transform: translateY(-3px);
  }
  .tile:active{
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(58,42,26,0.18);
  }
  .tile .hanzi{
    font-family:'Noto Sans SC', sans-serif;
    font-weight:900;
    font-size: 44px;
    line-height:1;
    display:block;
    color: var(--ink);
  }
  .tile .pinyin{
    display:block;
    margin-top:8px;
    font-size:13px;
    color: var(--ink-soft);
    font-weight:600;
  }
  .tile .speak{
    position:absolute;
    top:6px;
    right:6px;
    width:26px;
    height:26px;
    border-radius:50%;
    border: none;
    background: rgba(30,136,168,0.12);
    color: var(--forest);
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tile .speak:hover{ background: var(--forest); color:#fff; }

  .restart-row{ text-align:center; margin-top: 18px; }
  .restart{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    background: var(--lantern);
    color:#fff;
    border:3px solid var(--ink);
    border-radius: 999px;
    padding: 10px 26px;
    cursor:pointer;
    box-shadow: 0 5px 0 rgba(58,42,26,0.25);
  }
  .restart:hover{ background: var(--lantern-deep); }
  .restart:active{ transform: translateY(2px); box-shadow: 0 2px 0 rgba(58,42,26,0.25); }

  .trail{
    display:flex; gap:6px; justify-content:center; margin-top:22px;
  }
  .trail span{
    width:8px; height:8px; border-radius:50%;
    background: rgba(58,42,26,0.18);
  }
  .trail span.done{ background: var(--forest); }

  @media (max-width:420px){
    .tile{ width: 30%; padding:10px 6px 10px; }
    .tile .hanzi{ font-size: 32px; }
    .tile .pinyin{ font-size:11px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back-link" href="games.html">&larr; Back to menu</a>
    <p class="eyebrow">Learn Chinese through story</p>
    <h1>冒险乐园</h1>
    <p class="subtitle">Adventure Land — tap the Chinese character that shows what happens next</p>
  </header>

  <div class="stage">
    <div class="illustration" id="illustration"></div>
    <p class="caption" id="caption"></p>
    <p class="tag" id="tag" style="display:none;"></p>
    <p class="prompt" id="prompt">What happens next?</p>
    <div class="choices" id="choices"></div>
    <div class="restart-row" id="restartRow" style="display:none;">
      <button class="restart" id="restartBtn">重新开始 · Play again</button>
    </div>
  </div>

  <div class="trail" id="trail"></div>
</div>

<script>
function person(x, y, s, body, head, extra){
  return `<g transform="translate(${x},${y}) scale(${s})">
  <ellipse cx="10" cy="46" rx="16" ry="7" fill="rgba(0,0,0,0.12)"/>
  <rect x="0" y="18" width="20" height="26" rx="8" fill="${body}"/>
  <circle cx="10" cy="8" r="12" fill="${head}"/>
  <rect x="-4" y="24" width="8" height="18" rx="4" fill="${head}"/>
  <rect x="16" y="24" width="8" height="18" rx="4" fill="${head}"/>
  ${extra||''}
  </g>`;
}
const hairBob = (c) => `<path d="M-3 -2 Q10 -15 23 -2 L22 8 Q10 -1 -2 8 Z" fill="${c}"/>`;
const staffBadge = `<circle cx="10" cy="26" r="3" fill="#FFC145"/>`;
const ticketProp = `<g transform="translate(200,170)">
  <rect x="0" y="0" width="60" height="34" rx="6" fill="#FFF6E9" stroke="#3A2A1A" stroke-width="3"/>
  <circle cx="0" cy="17" r="5" fill="#BEE6F5"/>
  <circle cx="60" cy="17" r="5" fill="#BEE6F5"/>
  <line x1="14" y1="6" x2="14" y2="28" stroke="#3A2A1A" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="38" y="22" font-size="14" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-weight="900" fill="#E8543A">票</text>
</g>`;

function parkGround(){
  return `<path d="M0 205 Q100 185 200 208 T400 200 V260 H0 Z" fill="#E8C27A"/>
  <path d="M0 222 Q120 205 220 224 T400 216 V260 H0 Z" fill="#D9A94F"/>`;
}

function ferrisWheel(cx, cy, r){
  let spokes = '';
  for(let i=0;i<8;i++){
    const a = (i*45)*Math.PI/180;
    spokes += `<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="#E8543A" stroke-width="2" opacity="0.5"/>`;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E8543A" stroke-width="4" opacity="0.55"/>
  ${spokes}
  <line x1="${cx}" y1="${cy+r}" x2="${cx-14}" y2="${cy+r+26}" stroke="#B23A26" stroke-width="4" opacity="0.55"/>
  <line x1="${cx}" y1="${cy+r}" x2="${cx+14}" y2="${cy+r+26}" stroke="#B23A26" stroke-width="4" opacity="0.55"/>`;
}

function scene(top, bottom, propsBack, propsFront){
  return `<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bottom}"/>
  </linearGradient></defs>
  <rect width="400" height="260" fill="url(#g1)"/>
  <circle cx="340" cy="42" r="22" fill="#FFC145"/>
  ${propsBack||''}
  ${parkGround()}
  ${propsFront||''}
  </svg>`;
}

const svgStart = scene('#BEE6F5', '#EAF8FF', ferrisWheel(70, 100, 46), `
  <g transform="translate(150,90)">
    <rect x="0" y="0" width="18" height="90" fill="#B23A26"/>
    <rect x="82" y="0" width="18" height="90" fill="#B23A26"/>
    <path d="M0 0 Q50 -34 100 0 L100 16 Q50 -18 0 16 Z" fill="#E8543A"/>
    <path d="M8 -6 L16 8 M28 -10 L36 4 M48 -12 L56 2 M68 -10 L76 4 M84 -6 L92 8" stroke="#FFC145" stroke-width="4" stroke-linecap="round"/>
  </g>
  ${ticketProp}
  ${person(90, 150, 1.55, '#E8543A', '#F2C9A0', '')}
`);

const svgGuide = scene('#D6F0F5', '#F2FBFD', `
  <rect x="20" y="120" width="360" height="6" fill="#B23A26" opacity="0.3"/>
  <rect x="40" y="90" width="8" height="36" fill="#B23A26" opacity="0.4"/>
  <rect x="150" y="90" width="8" height="36" fill="#B23A26" opacity="0.4"/>
  <rect x="260" y="90" width="8" height="36" fill="#B23A26" opacity="0.4"/>
  <rect x="360" y="90" width="8" height="36" fill="#B23A26" opacity="0.4"/>
`, `
  ${person(120, 150, 1.5, '#1E88A8', '#F2C9A0', hairBob('#5C3A21') + staffBadge)}
  ${person(230, 150, 1.5, '#F6AD55', '#F2C9A0', staffBadge)}
`);

const svgHat = scene('#FBE1C6', '#FFF6E9', `
  <rect x="60" y="90" width="16" height="90" fill="#8B5A2B"/>
  <rect x="320" y="90" width="16" height="90" fill="#8B5A2B"/>
  <rect x="40" y="80" width="320" height="16" rx="4" fill="#A9772E"/>
`, `
  <g transform="translate(90,110)">
    <ellipse cx="30" cy="46" rx="10" ry="18" fill="#2B6CB0"/>
    <path d="M4 46 Q30 20 56 46 Z" fill="#2B6CB0"/>
    <ellipse cx="30" cy="46" rx="26" ry="7" fill="#1E4E7A"/>
  </g>
  <g transform="translate(270,120)">
    <ellipse cx="30" cy="40" rx="40" ry="9" fill="#E8543A"/>
    <path d="M12 40 Q30 4 48 40 Z" fill="#F6AD55"/>
  </g>
  ${person(180, 150, 1.4, '#1E88A8', '#F2C9A0', hairBob('#5C3A21') + staffBadge)}
`);

const svgEnd = `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
<rect width="400" height="220" fill="#FFF6E9"/>
<circle cx="200" cy="110" r="72" fill="none" stroke="#B23A26" stroke-width="6"/>
<circle cx="200" cy="110" r="58" fill="none" stroke="#B23A26" stroke-width="2"/>
<text x="200" y="130" font-size="70" text-anchor="middle" fill="#B23A26" font-family="'Noto Sans SC', sans-serif" font-weight="900">完</text>
</svg>`;

const story = {
  start: {
    bg: svgStart,
    caption: "Welcome to Adventure Land! I have one ticket. Who should I give it to?",
    choices: [
      { char:'我', pinyin:'wǒ', meaning:'me', next:'guide' },
      { char:'我们', pinyin:'wǒmen', meaning:'us', next:'end_no_ticket' },
      { char:'你', pinyin:'nǐ', meaning:'you', next:'end_already_works' }
    ]
  },
  guide: {
    bg: svgGuide,
    caption: "There are two employees here. Who do you want as your guide?",
    choices: [
      { char:'她', pinyin:'tā', meaning:'she', next:'hat' },
      { char:'他', pinyin:'tā', meaning:'he', next:'hat' }
    ]
  },
  hat: {
    bg: svgHat,
    caption: "Great! You also get a free hat. Which one do you want?",
    choices: [
      { char:'这', pinyin:'zhè', meaning:'this', next:'end_this' },
      { char:'那', pinyin:'nà', meaning:'that', next:'end_that' }
    ]
  },
  end_no_ticket: { ending:true, bg:svgEnd, caption:"\"Oh no — I'm sorry, I only have one ticket to give away today. Maybe next time you can come along!\" 只有一张票。" },
  end_already_works: { ending:true, bg:svgEnd, caption:"\"Wait... you already work here?!\" Ha — you don't need a ticket at all. Welcome back to work! 你已经在这里工作了！" },
  end_this: { ending:true, bg:svgEnd, caption:"You pick the cap by the gate. Your guide claps and says it suits you perfectly — time to explore Adventure Land! 戴上帽子，出发探险！" },
  end_that: { ending:true, bg:svgEnd, caption:"You pick the sun hat across the stand. Your guide grins — it's the perfect adventurer's hat! Time to explore Adventure Land! 戴上帽子，出发探险！" }
};

let path = [];

function speak(char){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(char);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function render(id, chosen){
  const scene = story[id];
  document.getElementById('illustration').innerHTML = scene.bg;
  document.getElementById('caption').textContent = scene.caption;

  const tag = document.getElementById('tag');
  if(chosen){
    tag.style.display = 'inline-flex';
    tag.textContent = `You chose: ${chosen.char} ${chosen.pinyin} — ${chosen.meaning}`;
  } else {
    tag.style.display = 'none';
  }

  const choicesEl = document.getElementById('choices');
  const promptEl = document.getElementById('prompt');
  const restartRow = document.getElementById('restartRow');

  if(scene.ending){
    choicesEl.innerHTML = '';
    promptEl.style.display = 'none';
    restartRow.style.display = 'block';
  } else {
    promptEl.style.display = 'block';
    restartRow.style.display = 'none';
    choicesEl.innerHTML = '';
    scene.choices.forEach(choice => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `
        <button class="speak" aria-label="Hear pronunciation">&#128266;</button>
        <span class="hanzi">${choice.char}</span>
        <span class="pinyin">${choice.pinyin}</span>
      `;
      tile.querySelector('.speak').addEventListener('click', (e) => {
        e.stopPropagation();
        speak(choice.char);
      });
      tile.addEventListener('click', () => {
        path.push(id);
        speak(choice.char);
        render(choice.next, choice);
      });
      choicesEl.appendChild(tile);
    });
  }
  renderTrail();
}

function renderTrail(){
  const trail = document.getElementById('trail');
  const total = 3;
  const done = Math.min(path.length, total);
  trail.innerHTML = '';
  for(let i=0;i<total;i++){
    const dot = document.createElement('span');
    if(i < done) dot.className = 'done';
    trail.appendChild(dot);
  }
}

document.getElementById('restartBtn').addEventListener('click', () => {
  path = [];
  render('start', null);
});

render('start', null);
</script>
</body>
</html>
