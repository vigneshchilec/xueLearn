<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王医生的一天 · Dr. Wang's Busy Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Sans+SC:wght@700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E9F7F5;
    --paper-deep: #DBF0EC;
    --ink: #1B3A3A;
    --ink-soft: #4F6E6B;
    --forest: #0F9B8E;
    --forest-light: #5FCBBF;
    --lantern: #E4572E;
    --lantern-deep: #B23A1D;
    --gold: #F2C14E;
    --card-radius: 22px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(15,155,142,0.15), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(228,87,46,0.15), transparent 50%),
      var(--paper);
    font-family:'Baloo 2', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 32px 16px 64px;
  }
  .app{ width:100%; max-width: 640px; }

  header{ text-align:center; margin-bottom: 22px; }
  .back-link{
    display:inline-block; margin-bottom:10px; font-size:13px; font-weight:600;
    color: var(--ink-soft); text-decoration:none;
  }
  .back-link:hover{ color: var(--lantern-deep); }
  .eyebrow{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--forest); font-weight:600; margin:0 0 6px;
  }
  h1{
    font-family:'ZCOOL KuaiLe', 'Baloo 2', sans-serif;
    font-size: clamp(26px, 6vw, 34px);
    margin: 0 0 4px;
    color: var(--lantern-deep);
  }
  .subtitle{ margin:0; font-size:14px; color: var(--ink-soft); }

  .wen-intro{
    display:flex; gap:12px; align-items:center; text-align:left;
    background: var(--paper-deep); border:3px solid var(--ink); border-radius: var(--card-radius);
    padding:14px 18px; margin:22px 0 26px; box-shadow:0 6px 0 rgba(46,33,21,0.15);
  }
  .wen-intro-avatar{ width:44px; height:44px; flex-shrink:0; }
  .wen-intro-name{ font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--lantern-deep); margin-bottom:2px; }
  .wen-intro-msg{ font-size:14px; color:var(--ink); font-weight:600; line-height:1.4; font-family:'Baloo 2',sans-serif; }

  .stage{
    background: var(--paper-deep);
    border: 3px solid var(--ink);
    border-radius: var(--card-radius);
    padding: 14px;
    box-shadow: 0 8px 0 rgba(27,58,58,0.12);
  }
  .illustration{
    width:100%;
    display:block;
    border-radius: 14px;
    overflow:hidden;
    background:#fff;
  }
  .illustration svg{ width:100%; height:auto; display:block; }

  .caption{
    margin: 16px 4px 4px;
    font-size: 16px;
    line-height:1.55;
    color: var(--ink);
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin: 10px 4px 0;
    padding: 5px 12px;
    background: rgba(228,87,46,0.12);
    color: var(--lantern-deep);
    border-radius: 999px;
    font-size: 13px;
    font-weight:600;
  }

  .prompt{
    margin: 20px 4px 10px;
    font-size: 14px;
    color: var(--forest);
    font-weight:600;
  }

  .choices{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top: 6px;
  }
  .tile{
    position:relative;
    width: 150px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 14px 10px 12px;
    text-align:center;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
    box-shadow: 0 5px 0 rgba(27,58,58,0.18);
  }
  .tile:hover{
    background: var(--gold);
    transform: translateY(-3px);
  }
  .tile:active{
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(27,58,58,0.18);
  }
  .tile .hanzi{
    font-family:'Noto Sans SC', sans-serif;
    font-weight:900;
    font-size: 44px;
    line-height:1;
    display:block;
    color: var(--ink);
  }
  .tile .pinyin{
    display:block;
    margin-top:8px;
    font-size:13px;
    color: var(--ink-soft);
    font-weight:600;
  }
  .tile .speak{
    position:absolute;
    top:6px;
    right:6px;
    width:26px;
    height:26px;
    border-radius:50%;
    border: none;
    background: rgba(15,155,142,0.12);
    color: var(--forest);
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tile .speak:hover{ background: var(--forest); color:#fff; }

  .restart-row{ text-align:center; margin-top: 18px; }
  .restart{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    background: var(--lantern);
    color:#fff;
    border:3px solid var(--ink);
    border-radius: 999px;
    padding: 10px 26px;
    cursor:pointer;
    box-shadow: 0 5px 0 rgba(27,58,58,0.25);
  }
  .restart:hover{ background: var(--lantern-deep); }
  .restart:active{ transform: translateY(2px); box-shadow: 0 2px 0 rgba(27,58,58,0.25); }

  .trail{
    display:flex; gap:6px; justify-content:center; margin-top:22px;
  }
  .trail span{
    width:8px; height:8px; border-radius:50%;
    background: rgba(27,58,58,0.18);
  }
  .trail span.done{ background: var(--forest); }

  @media (max-width:420px){
    .tile{ width: 30%; padding:10px 6px 10px; }
    .tile .hanzi{ font-size: 32px; }
    .tile .pinyin{ font-size:11px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back-link" href="games.html">&larr; Back to menu</a>
    <p class="eyebrow">With Wen</p>
    <h1>王医生的一天</h1>
    <p class="subtitle">Dr. Wang's Busy Day — tap the character that shows what she should do next</p>
  </header>

  <div class="stage">
    <div class="illustration" id="illustration"></div>
    <p class="caption" id="caption"></p>
    <p class="tag" id="tag" style="display:none;"></p>
    <p class="prompt" id="prompt">What should Dr. Wang do?</p>
    <div class="choices" id="choices"></div>
    <div class="restart-row" id="restartRow" style="display:none;">
      <div class="wen-intro" style="margin:0 0 16px;max-width:420px;margin-left:auto;margin-right:auto">
        <svg class="wen-intro-avatar" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" fill="url(#wenDoneGrad)"/>
        <defs>
          <radialGradient id="wenDoneGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FCCB7B"/>
            <stop offset="55%" stop-color="#E8A94C"/>
            <stop offset="100%" stop-color="#E2603A"/>
          </radialGradient>
        </defs>
        <circle cx="24" cy="30" r="2.6" fill="#3A2415"/>
        <circle cx="40" cy="30" r="2.6" fill="#3A2415"/>
        <path d="M23 39q9 8 18 0" stroke="#3A2415" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </svg>
        <div>
          <div class="wen-intro-name">WEN</div>
          <div class="wen-intro-msg">You helped Dr. Wang have a great day! I'm proud of you. 你帮王医生度过了忙碌的一天，我为你骄傲！</div>
        </div>
      </div>
      <button class="restart" id="restartBtn">重新开始 · Play again</button>
    </div>
  </div>

  <div class="trail" id="trail"></div>
</div>

<script>
function person(x, y, s, body, head, extra){
  return `<g transform="translate(${x},${y}) scale(${s})">
  <ellipse cx="10" cy="46" rx="16" ry="7" fill="rgba(0,0,0,0.12)"/>
  <rect x="0" y="18" width="20" height="26" rx="8" fill="${body}"/>
  <circle cx="10" cy="8" r="12" fill="${head}"/>
  <rect x="-4" y="24" width="8" height="18" rx="4" fill="${head}"/>
  <rect x="16" y="24" width="8" height="18" rx="4" fill="${head}"/>
  ${extra||''}
  </g>`;
}
const hairBun = (c) => `<circle cx="10" cy="-3" r="5" fill="${c}"/>`;
const collarTrim = `<path d="M4 18 L10 26 L16 18 Z" fill="#38B2AC"/>`;
const stethoscope = `<path d="M4 20 Q0 34 10 33 Q20 34 16 20" stroke="#2D3748" stroke-width="2" fill="none"/><circle cx="10" cy="35" r="3" fill="#2D3748"/>`;

function clinicBase(propsBack, propsFront){
  return `<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" fill="#E6FFFA"/>
  <rect x="0" y="0" width="400" height="170" fill="#CFF7EF"/>
  ${propsBack||''}
  <rect x="0" y="170" width="400" height="90" fill="#CBD5E0"/>
  <g stroke="#B4C0CC" stroke-width="2">
  <line x1="0" y1="192" x2="400" y2="192"/>
  <line x1="0" y1="218" x2="400" y2="218"/>
  <line x1="0" y1="244" x2="400" y2="244"/>
  <line x1="100" y1="170" x2="100" y2="260"/>
  <line x1="200" y1="170" x2="200" y2="260"/>
  <line x1="300" y1="170" x2="300" y2="260"/>
  </g>
  ${propsFront||''}
  </svg>`;
}

const crossSign = `<g transform="translate(320,26)">
  <rect x="0" y="0" width="52" height="52" rx="8" fill="#FFFFFF" stroke="#38B2AC" stroke-width="3"/>
  <rect x="21" y="10" width="10" height="32" fill="#E53E3E"/>
  <rect x="10" y="21" width="32" height="10" fill="#E53E3E"/>
</g>`;

const bedProp = `<g transform="translate(30,90)">
  <rect x="0" y="30" width="90" height="16" rx="4" fill="#A0AEC0"/>
  <rect x="0" y="10" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2"/>
  <rect x="0" y="46" width="8" height="20" fill="#718096"/>
  <rect x="82" y="46" width="8" height="20" fill="#718096"/>
</g>`;

const svgStart = clinicBase(crossSign + bedProp, `
  ${person(150, 150, 1.5, '#F6AD55', '#F2C9A0', '')}
  <g transform="translate(190,150)">
    <rect x="0" y="0" width="6" height="30" rx="3" fill="#E2E8F0" stroke="#4A5568" stroke-width="1.5"/>
    <rect x="0" y="20" width="6" height="10" rx="3" fill="#E53E3E"/>
  </g>
`);

const svgLook = clinicBase(crossSign, `
  ${person(150, 150, 1.5, '#F6AD55', '#F2C9A0', '')}
  ${person(225, 130, 1.65, '#FFFFFF', '#F2C9A0', hairBun('#4A3222') + collarTrim + stethoscope)}
  <g transform="translate(280,150)">
    <rect x="0" y="0" width="34" height="46" rx="4" fill="#FFFFFF" stroke="#4A5568" stroke-width="2"/>
    <rect x="9" y="-6" width="16" height="10" rx="3" fill="#A0AEC0"/>
    <line x1="6" y1="14" x2="28" y2="14" stroke="#CBD5E0" stroke-width="2"/>
    <line x1="6" y1="22" x2="28" y2="22" stroke="#CBD5E0" stroke-width="2"/>
    <line x1="6" y1="30" x2="28" y2="30" stroke="#CBD5E0" stroke-width="2"/>
  </g>
`);

const svgAsk = clinicBase(crossSign, `
  <g transform="translate(120,50)">
    <path d="M0 20 Q0 0 22 0 L108 0 Q130 0 130 20 L130 44 Q130 64 108 64 L46 64 L28 84 L34 64 L22 64 Q0 64 0 44 Z" fill="#FFFFFF" stroke="#38B2AC" stroke-width="2"/>
  </g>
  ${person(150, 150, 1.5, '#F6AD55', '#F2C9A0', '')}
  ${person(225, 130, 1.65, '#FFFFFF', '#F2C9A0', hairBun('#4A3222') + collarTrim + stethoscope)}
`);

const svgMeasure = clinicBase(crossSign, `
  ${person(150, 150, 1.5, '#F6AD55', '#F2C9A0', '')}
  ${person(225, 130, 1.65, '#FFFFFF', '#F2C9A0', hairBun('#4A3222') + collarTrim + stethoscope)}
  <g transform="translate(190,140)">
    <rect x="0" y="0" width="8" height="34" rx="4" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/>
    <rect x="0" y="22" width="8" height="12" rx="4" fill="#E53E3E"/>
    <circle cx="4" cy="34" r="5" fill="#E53E3E"/>
  </g>
`);

const svgEnd = `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
<rect width="400" height="220" fill="#E9F7F5"/>
<circle cx="200" cy="110" r="72" fill="none" stroke="#B23A1D" stroke-width="6"/>
<circle cx="200" cy="110" r="58" fill="none" stroke="#B23A1D" stroke-width="2"/>
<text x="200" y="130" font-size="70" text-anchor="middle" fill="#B23A1D" font-family="'Noto Sans SC', sans-serif" font-weight="900">完</text>
</svg>`;

const story = {
  start: {
    bg: svgStart,
    caption: "A little boy walked into the clinic holding his tummy, his face red and warm. What should Dr. Wang do first?",
    choices: [
      { char:'看', pinyin:'kàn', meaning:'look/examine', next:'look1' },
      { char:'问', pinyin:'wèn', meaning:'ask', next:'ask1' },
      { char:'量', pinyin:'liáng', meaning:'measure', next:'measure1' }
    ]
  },
  look1: {
    bg: svgLook,
    caption: "Dr. Wang looked closely and saw the boy's cheeks were flushed and his eyes looked tired.",
    choices: [
      { char:'问', pinyin:'wèn', meaning:'ask', next:'end_look_ask' },
      { char:'笑', pinyin:'xiào', meaning:'smile', next:'end_look_smile' },
      { char:'量', pinyin:'liáng', meaning:'measure', next:'end_look_measure' }
    ]
  },
  ask1: {
    bg: svgAsk,
    caption: "Dr. Wang asked the boy gently, \"Where does it hurt?\" He pointed at his tummy and sniffled.",
    choices: [
      { char:'看', pinyin:'kàn', meaning:'look', next:'end_ask_look' },
      { char:'药', pinyin:'yào', meaning:'medicine', next:'end_ask_medicine' },
      { char:'笑', pinyin:'xiào', meaning:'smile', next:'end_ask_smile' }
    ]
  },
  measure1: {
    bg: svgMeasure,
    caption: "Dr. Wang measured his temperature — 39 degrees, quite a fever!",
    choices: [
      { char:'药', pinyin:'yào', meaning:'medicine', next:'end_measure_medicine' },
      { char:'睡', pinyin:'shuì', meaning:'rest', next:'end_measure_sleep' },
      { char:'问', pinyin:'wèn', meaning:'ask', next:'end_measure_ask' }
    ]
  },
  end_look_ask: { ending:true, bg:svgEnd, caption:"Dr. Wang asked more questions and learned he'd eaten too much ice cream. She gave him gentle advice, and he felt better by dinner." },
  end_look_smile: { ending:true, bg:svgEnd, caption:"Dr. Wang smiled warmly to calm his worry, then checked him carefully and found it was just a small cold." },
  end_look_measure: { ending:true, bg:svgEnd, caption:"Dr. Wang measured his temperature, found a mild fever, and gave his mom simple instructions for rest at home." },
  end_ask_look: { ending:true, bg:svgEnd, caption:"Dr. Wang looked closely at his tummy and found nothing serious — just needed a warm cup of water and rest." },
  end_ask_medicine: { ending:true, bg:svgEnd, caption:"Dr. Wang gave him a small dose of medicine. Within an hour, the boy was smiling and ready to play again." },
  end_ask_smile: { ending:true, bg:svgEnd, caption:"Dr. Wang smiled and told a silly joke. The boy laughed, forgot about the pain, and felt much braver." },
  end_measure_medicine: { ending:true, bg:svgEnd, caption:"Dr. Wang gave him fever medicine and told his mom to bring him back if it didn't improve. By morning, his fever was gone." },
  end_measure_sleep: { ending:true, bg:svgEnd, caption:"Dr. Wang told him to go home, drink water, and sleep well. The next day, he came back smiling and healthy." },
  end_measure_ask: { ending:true, bg:svgEnd, caption:"Dr. Wang asked his mom more questions and discovered he was just overheated from playing outside too long." }
};

let path = [];

function speak(char){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(char);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function render(id, chosen){
  const scene = story[id];
  document.getElementById('illustration').innerHTML = scene.bg;
  document.getElementById('caption').textContent = scene.caption;

  const tag = document.getElementById('tag');
  if(chosen){
    tag.style.display = 'inline-flex';
    tag.textContent = `You chose: ${chosen.char} ${chosen.pinyin} — ${chosen.meaning}`;
  } else {
    tag.style.display = 'none';
  }

  const choicesEl = document.getElementById('choices');
  const promptEl = document.getElementById('prompt');
  const restartRow = document.getElementById('restartRow');

  if(scene.ending){
    choicesEl.innerHTML = '';
    promptEl.style.display = 'none';
    restartRow.style.display = 'block';
  } else {
    promptEl.style.display = 'block';
    restartRow.style.display = 'none';
    choicesEl.innerHTML = '';
    scene.choices.forEach(choice => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `
        <button class="speak" aria-label="Hear pronunciation">&#128266;</button>
        <span class="hanzi">${choice.char}</span>
        <span class="pinyin">${choice.pinyin}</span>
      `;
      tile.querySelector('.speak').addEventListener('click', (e) => {
        e.stopPropagation();
        speak(choice.char);
      });
      tile.addEventListener('click', () => {
        path.push(id);
        speak(choice.char);
        render(choice.next, choice);
      });
      choicesEl.appendChild(tile);
    });
  }
  renderTrail();
}

function renderTrail(){
  const trail = document.getElementById('trail');
  const total = 3;
  const done = Math.min(path.length, total);
  trail.innerHTML = '';
  for(let i=0;i<total;i++){
    const dot = document.createElement('span');
    if(i < done) dot.className = 'done';
    trail.appendChild(dot);
  }
}

document.getElementById('restartBtn').addEventListener('click', () => {
  path = [];
  render('start', null);
});

render('start', null);
</script>
</body>
</html>
